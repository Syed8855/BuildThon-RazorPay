services:
  - type: web
    name: payment-recovery-api
    env: python
    region: singapore  # closest to India
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUTF8
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.0"
